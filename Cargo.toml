[package]
name = "corebox-rs"
version = "3.0.0"
edition = "2021"
description = "CoreBox game engine compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.105"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Storage", "Element", "HtmlElement", "Node", "console"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", features = ["small_rng"] }
getrandom = { version = "0.2", features = ["js"] }
once_cell = "1"
uuid = { version = "1", features = ["v4", "js"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
